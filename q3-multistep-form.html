<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Step Form</title><style>body{font:16px Arial;max-width:500px;margin:40px auto}.step{display:none}.step.active{display:block}label{display:block;margin:16px 0}small{color:red}</style></head><body><h1>Registration — Step <span id="number">1</span> of 3</h1><form id="wizard"><section class="step active"><label>Name <input id="name" required></label></section><section class="step"><label>Email <input id="email" type="email" required></label></section><section class="step"><label>Password <input id="password" type="password" minlength="8" required></label></section><p id="error" role="alert"></p><button type="button" id="back">Back</button><button type="button" id="next">Next</button></form><pre id="summary"></pre><script>
const steps=[...document.querySelectorAll(".step")];let current=0;
function show(){steps.forEach((step,i)=>step.classList.toggle("active",i===current));document.querySelector("#number").textContent=current+1;document.querySelector("#back").hidden=current===0;document.querySelector("#next").textContent=current===2?"Finish":"Next";}
document.querySelector("#back").onclick=()=>{if(current>0)current--;show();};
document.querySelector("#next").onclick=()=>{const field=steps[current].querySelector("input");if(!field.checkValidity()){field.reportValidity();return;}if(current<2){current++;show();}else{document.querySelector("#summary").textContent=JSON.stringify({name:document.querySelector("#name").value,email:document.querySelector("#email").value,password:"(hidden)"},null,2);document.querySelector("#wizard").hidden=true;}};
show();
</script></body></html>
