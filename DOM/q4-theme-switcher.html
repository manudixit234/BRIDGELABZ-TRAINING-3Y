<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Switcher</title><style>body{font:16px Arial;padding:30px;background:white;color:#222}body[data-theme="dark"]{background:#222;color:white}body[data-theme="blue"]{background:#e6f2ff;color:#06386b}button{padding:10px;margin:5px}</style></head><body data-theme="light"><h1>Theme Switcher</h1><p>Choose a theme to update this page.</p><button data-theme="light">Light</button><button data-theme="dark">Dark</button><button data-theme="blue">Blue</button><p id="current">Current theme: light</p><script>
document.querySelectorAll("button[data-theme]").forEach(button=>button.addEventListener("click",()=>{document.body.setAttribute("data-theme",button.dataset.theme);document.body.setAttribute("data-current-theme",button.dataset.theme);document.querySelector("#current").textContent="Current theme: "+document.body.getAttribute("data-current-theme");}));
</script></body></html>
