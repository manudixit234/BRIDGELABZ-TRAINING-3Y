<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Table Filter</title><style>body{font:16px Arial;margin:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:10px;text-align:left}</style></head><body><h1>Student Directory</h1><input id="search" placeholder="Search name, branch or CGPA"><table><thead><tr><th>Name</th><th>Branch</th><th>CGPA</th></tr></thead><tbody id="rows"><tr><td>Amit</td><td>CSE</td><td>8.4</td></tr><tr><td>Sara</td><td>AI & DS</td><td>9.1</td></tr><tr><td>Kiran</td><td>ECE</td><td>7.8</td></tr></tbody></table><p id="empty" hidden>No results found</p><script>
const rows=[...document.querySelectorAll("#rows tr")],empty=document.querySelector("#empty");
document.querySelector("#search").addEventListener("input",e=>{const query=e.target.value.toLowerCase();let visible=0;rows.forEach(row=>{const match=row.textContent.toLowerCase().includes(query);row.hidden=!match;if(match)visible++;});empty.hidden=visible!==0;});
</script></body></html>
