<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Submit Blocker</title><style>body{font:16px Arial;max-width:500px;margin:40px auto}label{display:block;margin:12px 0}small{color:red;display:block}</style></head><body><h1>Registration Form</h1><form id="form" novalidate><label>Name <input id="name"></label><small id="nameError"></small><label>Email <input id="email"></label><small id="emailError"></small><label>Password <input id="password" type="password"></label><small id="passwordError"></small><button>Submit</button></form><p id="success" role="status"></p><script>
const form=document.querySelector("#form"),fields=["name","email","password"];
function validate(id){const input=document.getElementById(id),value=input.value.trim();let message="";if(!value)message="This field is required.";else if(id==="email"&&!value.includes("@"))message="Email must contain @.";else if(id==="password"&&value.length<6)message="Password must be at least 6 characters.";document.getElementById(id+"Error").textContent=message;return !message;}
form.addEventListener("submit",e=>{e.preventDefault();const valid=fields.map(validate).every(Boolean);document.querySelector("#success").textContent=valid?"Form Submitted Successfully":"";});
fields.forEach(id=>document.getElementById(id).addEventListener("input",()=>validate(id)));
</script></body></html>
