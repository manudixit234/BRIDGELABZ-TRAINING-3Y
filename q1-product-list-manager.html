<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product List Manager</title><style>body{font:16px Arial;max-width:650px;margin:40px auto;padding:0 16px}li{padding:10px;border-bottom:1px solid #ddd}button{margin-left:8px}</style></head><body><h1>Product List Manager</h1><input id="productInput" placeholder="New product"><button id="add">Add</button><ul id="products"><li><span class="name">Keyboard</span> <button data-action="edit">Edit</button><button data-action="delete">Delete</button></li></ul><script>
const list=document.querySelector("#products"),input=document.querySelector("#productInput");let editing=null;
function saveEdit(){if(!editing)return;const editor=editing.querySelector("input"),name=editor.value.trim()||editor.dataset.original;const span=document.createElement("span");span.className="name";span.textContent=name;editor.replaceWith(span);editing=null;}
document.querySelector("#add").addEventListener("click",()=>{const name=input.value.trim();if(!name)return;const li=document.createElement("li"),span=document.createElement("span");span.className="name";span.textContent=name;li.append(span,document.createTextNode(" "));for(const action of ["edit","delete"]){const button=document.createElement("button");button.dataset.action=action;button.textContent=action[0].toUpperCase()+action.slice(1);li.append(button);}list.append(li);input.value="";});
list.addEventListener("click",event=>{const action=event.target.dataset.action;if(!action)return;const li=event.target.closest("li");if(action==="delete"){if(editing===li)editing=null;li.remove();return;}if(editing)saveEdit();const span=li.querySelector(".name"),editor=document.createElement("input");editor.value=span.textContent;editor.dataset.original=span.textContent;span.replaceWith(editor);editing=li;editor.focus();});
document.addEventListener("click",event=>{if(editing&&!editing.contains(event.target))saveEdit();});
</script></body></html>
