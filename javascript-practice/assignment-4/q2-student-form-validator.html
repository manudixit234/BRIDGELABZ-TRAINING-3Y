<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Form Validator</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Student Registration</h1><form id="studentForm" novalidate>
<label>Name <input id="name" required></label><small id="nameError"></small>
<label>Email <input id="email" type="email" required></label><small id="emailError"></small>
<label>Phone <input id="phone" inputmode="numeric" required></label><small id="phoneError"></small>
<label>Password <input id="password" type="password" required></label><small id="passwordError"></small>
<button>Validate</button></form><p id="result" aria-live="polite"></p></main><script src="q2-student-form-validator.js"></script></body></html>
